name: Validate inputs
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install validation dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.3.3
      - name: Check Python syntax
        run: python -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8-sig')) for p in pathlib.Path('.').rglob('*.py')]"
      - name: Check optimization inputs
        run: python -B 4-repmobo_optimization/scripts/04_validate_review_package.py
      - name: List tasks without training
        run: python -B 4-repmobo_optimization/scripts/06_run_all.py
